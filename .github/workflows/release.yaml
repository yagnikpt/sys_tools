name: Release

on:
  push:
    tags:
      - "bmark/v*"
      - "article_spawner/v*"
      - "pagewatch/v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract tool name from tag
        id: meta
        run: |
          TOOL="${GITHUB_REF_NAME%%/*}"
          VERSION="${GITHUB_REF_NAME#*/}"
          echo "tool=$TOOL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.meta.outputs.tool }}/go.mod
          cache-dependency-path: ${{ steps.meta.outputs.tool }}/go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Run GoReleaser
        shell: bash
        working-directory: ${{ steps.meta.outputs.tool }}
        run: |
          git tag -f "$VERSION" "$GITHUB_SHA"
          if [[ "$TOOL" == "pagewatch" ]]; then
            goreleaser release --clean --skip=publish
            assets=(dist/*.tar.gz dist/*checksums.txt)
            if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
              if [[ "$draft" == "true" ]]; then
                gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
                gh release edit "$RELEASE_TAG" --title "$TOOL $VERSION" --draft=false
              else
                echo "GitHub release $RELEASE_TAG already published; skipping asset upload"
              fi
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$TOOL $VERSION" --generate-notes
            fi
          else
            goreleaser release --clean
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOOL: ${{ steps.meta.outputs.tool }}
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
