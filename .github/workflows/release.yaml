name: Release

on:
  push:
    tags:
      - "bmark/v*"
      - "article_spawner/v*"
      - "pagewatch/v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract tool name from tag
        id: meta
        run: |
          TOOL="${GITHUB_REF_NAME%%/*}"
          VERSION="${GITHUB_REF_NAME#*/}"
          echo "tool=$TOOL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.meta.outputs.tool }}/go.mod
          cache-dependency-path: ${{ steps.meta.outputs.tool }}/go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Run GoReleaser
        shell: bash
        working-directory: ${{ steps.meta.outputs.tool }}
        run: |
          git tag -f ${{ steps.meta.outputs.version }} ${{ github.sha }}
          goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.version }}
